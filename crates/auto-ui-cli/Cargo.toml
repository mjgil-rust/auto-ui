[package]
name = "auto-ui"
version.workspace = true
edition.workspace = true

[lib]
name = "auto_ui_cli"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
auto-ui-adapter-gpui = { path = "../auto-ui-adapter-gpui" }
auto-ui-adapter-rust-chatbot = { path = "../auto-ui-adapter-rust-chatbot" }
auto-ui-artifacts = { path = "../auto-ui-artifacts" }
auto-ui-core = { path = "../auto-ui-core" }
clap.workspace = true
schemars.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
auto-ui-driver-x11 = { path = "../auto-ui-driver-x11" }

[target.'cfg(target_os = "macos")'.dependencies]
auto-ui-driver-macos = { path = "../auto-ui-driver-macos" }

[dev-dependencies]
tempfile.workspace = true
