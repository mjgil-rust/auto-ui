[workspace]
members = [
    "crates/auto-ui-cli",
    "crates/auto-ui-core",
    "crates/auto-ui-artifacts",
    "crates/auto-ui-driver-x11",
    "crates/auto-ui-adapter-rust-chatbot",
    "crates/auto-ui-adapter-gpui",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1"
schemars = { version = "0.8", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
